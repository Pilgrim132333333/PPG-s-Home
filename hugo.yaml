  about:
    enable: true
    title: "About Me"
    content: |-
      我是郭梓耕，一名计算机科学方向的学生，关注 AI 应用、全栈系统、算法实验和计算机视觉。

      我的项目经历覆盖 AI 学习助手、在线背包问题遗传算法、3D 情感表达 AI Agent、叶子识别和跨域抽象视觉推理。我喜欢在“能运行”之外继续追问：数据是否组织清楚、用户是否真的顺手、系统是否能长期维护、实验结论是否可复现。
    skills:
      enable: true
      title: "近期主要使用的技术："
      items:
        - "Java / Spring Boot"
        - "Python / Machine Learning"
        - "C++ / Algorithm Design"
        - "Vue.js / Web Frontend"
        - "MySQL / Database Design"
        - "LLM / Knowledge Base Apps"
        - "Computer Vision"
        - "Experiment Design"

