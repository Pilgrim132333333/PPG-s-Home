        content: "组织课程资料、题库、历史学习数据和个人知识库，让 AI 更好服务复习、问答和知识沉淀。"
        image: "/images/projects/ai-learning.svg"
        badges: ["LLM", "Knowledge Base", "Full-Stack"]
      - title: "跨域抽象视觉推理数据集"
        content: "构建 RAVEN-style 3×3 数据集，关注规则标注、解释文本、泛化验证和可解释性。"
        image: "/images/projects/visual-reasoning.svg"
        badges: ["Computer Vision", "Dataset", "Reasoning"]
      - title: "遗传算法解决在线背包问题"
        content: "从编码、适应度函数到选择、交叉、变异，搭建可对比、可调参的算法实验流程。"
        image: "/images/projects/algorithm.svg"
        badges: ["C++", "Genetic Algorithm", "Optimization"]
