baseURL: "https://pilgrim132333333.github.io/PPG-s-Home/"
title: "郭梓耕 Zigeng Guo"
theme: "LoveIt"
defaultContentLanguage: "zh-cn"
hasCJKLanguage: true
canonifyURLs: true
enableRobotsTXT: true
enableEmoji: true
enableGitInfo: true

languages:
  zh-cn:
    label: "简体中文"
    locale: "zh-CN"
    weight: 1

pagination:
  pagerSize: 10

outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

caches:
  images:
    dir: ":cacheDir/images"

menu:
  main:
    - identifier: "about"
      name: "关于"
      url: "/about/"
      weight: 1
    - identifier: "experience"
      name: "经历"
      url: "/experience/"
      weight: 2
    - identifier: "projects"
      name: "项目"
      url: "/projects/"
      weight: 3

params:
  defaultTheme: "auto"
  gitRepo: "https://github.com/Pilgrim132333333/PPG-s-Home"
  fingerprint: ""
  dateFormat: "2006-01-02"
  title: "郭梓耕 Zigeng Guo"
  description: "计算机科学、AI 应用、全栈开发、算法实验与计算机视觉。"
  images:
    - "images/hero-studio.png"

  author:
    name: "Zigeng Guo"
    email: "pilgrim137735@gmail.com"
    link: "https://github.com/Pilgrim132333333"

  header:
    desktopMode: "fixed"
    mobileMode: "auto"
    title:
      logo: "/favicon.png"
      name: "Zigeng Guo"
      pre: ""
      post: ""
      typeit: false

  footer:
    enable: true
    custom: ""
    hugo: true
    copyright: true
    author: true
    since: 2026
    license: ""

  app:
    title: "Zigeng Guo"
    noFavicon: false
    svgFavicon: "/images/avatar.svg"
    themeColor: "#ffffff"
    iconColor: "#0f5f59"
    tileColor: "#0f5f59"

  search:
    enable: false
    type: "fuse"
    contentLength: 4000
    placeholder: "搜索"
    maxResultLength: 10
    snippetLength: 40
    highlightTag: "em"
    absoluteURL: true
    fuse:
      isCaseSensitive: false
      minMatchCharLength: 2
      findAllMatches: false
      location: 0
      threshold: 0.3
      distance: 100
      ignoreLocation: false

  home:
    rss: 10
    profile:
      enable: true
      gravatarEmail: ""
      avatarURL: "/images/avatar.svg"
      title: "郭梓耕"
      subtitle: "Computer Science · AI Applications · Full-Stack"
      typeit: true
      social: true
      disclaimer: "把复杂问题拆成清晰步骤，再用工程方法做成可靠、可维护、真正有用的产品。"
    posts:
      enable: false
      paginate: 6

  social:
    GitHub: "Pilgrim132333333"
    Email: "pilgrim137735@gmail.com"

  page:
    hiddenFromHomePage: false
    hiddenFromSearch: false
    twemoji: false
    lightgallery: true
    ruby: true
    fraction: true
    fontawesome: true
    linkToMarkdown: false
    rssFullText: false
    toc:
      enable: true
      keepStatic: false
      auto: true
    code:
      copy: true
      maxShownLines: 50
    share:
      enable: false
